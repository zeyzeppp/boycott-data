<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marka Eşleştirme</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#16211b;--muted:#5d6b63;--line:#e3e7e4;--accent:#2f7a3a;--accent-bg:#e7f3e8;--warn:#a85a12;--warn-bg:#fbefe3;--bad:#b42318;--bad-bg:#fdecea;--chip:#eef1ef}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111513;--card:#1a201d;--text:#e7ece9;--muted:#9aa8a0;--line:#2b332f;--accent:#6cc070;--accent-bg:#1f3322;--warn:#e6a35c;--warn-bg:#35281b;--bad:#f2786d;--bad-bg:#3a1f1d;--chip:#242b27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button span{opacity:.75;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.count{color:var(--muted);font-size:13px;margin-left:auto}
input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 10px;font:inherit;min-width:220px}
main{padding:14px 16px 90px}
.help{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row.done{border-color:var(--accent)}
.row.split{border-color:var(--bad)}
.brand{display:flex;gap:10px;align-items:flex-start;min-width:0}
.logo{width:48px;height:48px;border-radius:10px;background:#fff;border:1px solid var(--line);object-fit:contain;flex:none}
.ph{width:48px;height:48px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:700;color:var(--muted);flex:none}
.name{font-weight:650;word-break:break-word}
.name a{color:inherit}
.meta a{color:var(--accent)}
.meta{font-size:12.5px;color:var(--muted)}
.src{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.right{min-width:0}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cand{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:10px;padding:4px 8px 4px 4px;cursor:pointer;font:inherit;font-size:13px;max-width:100%;text-align:left}
.cand img,.cand .mini{width:26px;height:26px;border-radius:6px;background:#fff;object-fit:contain;flex:none}
.mini{display:grid;place-items:center;background:var(--card);font-size:11px;color:var(--muted)}
.cand[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent)}
.cand small,.results small{color:var(--muted)}
.choice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.pill{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.ok{background:var(--accent-bg);color:var(--accent)}
.pill.no{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.v{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.v.r{background:var(--bad-bg);color:var(--bad)}
.v.o{background:var(--warn-bg);color:var(--warn)}
.v.g{background:var(--accent-bg);color:var(--accent)}
.link{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:2px 4px;text-decoration:underline}
.link.bad{color:var(--bad)}
.search{position:relative}
.search input{width:100%}
.results{position:absolute;z-index:3;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:280px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.results button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:none;background:none;color:var(--text);padding:6px 8px;cursor:pointer;font:inherit;font-size:13.5px}
.results button:hover,.results button:focus{background:var(--chip)}
.results img,.results .mini{width:26px;height:26px;border-radius:6px;background:#fff;object-fit:contain;flex:none}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
footer .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{color:var(--accent);font-size:13px}
@media (max-width:720px){.row{grid-template-columns:1fr}input[type=search]{min-width:0;flex:1}.count{margin-left:0}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>bykt.org ↔ Boykot Dedektifi eşleştirme</h1>
  <div class="sub">Her bykt.org markası için Boykot Dedektifi'ndeki karşılığını kontrol edin. Bitince alttan <b>eslesme_kararlari.json</b>'u indirip gönderin. Yarıda bırakırsanız indirdiğiniz dosyayı <b>"Kaldığım yerden devam"</b> ile geri yükleyebilirsiniz.</div>
  <div class="bar">
    <div class="tabs" role="group">
      <button data-tab="un" aria-pressed="true">Eşleşmeyenler <span id="n-un"></span></button>
      <button data-tab="diff">Farklı yazılmış / çakışan <span id="n-diff"></span></button>
      <button data-tab="same">Adı aynı olanlar <span id="n-same"></span></button>
    </div>
    <input type="search" id="filter" placeholder="Marka ara…">
    <span class="count" id="count"></span>
  </div>
</div></header>
<main><div class="wrap">
  <div class="help" id="help"></div>
  <div id="list"></div>
</div></main>
<footer><div class="wrap">
  <span id="summary" class="sub"></span>
  <span class="toast" id="toast"></span>
  <span style="flex:1"></span>
  <label class="btn" for="load">Kaldığım yerden devam</label>
  <input type="file" id="load" accept=".json,application/json" hidden>
  <button class="btn primary" id="download">eslesme_kararlari.json indir</button>
</div></footer>
<script>
const DATA = /*DATA*/null;
const BD = new Map(DATA.bd.map(b => [b.k, b]));
const BY = new Map(DATA.by.map(i => [i.k, i]));
const norm = s => String(s).toLocaleLowerCase('tr').normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/ı/g,'i').replace(/[^a-z0-9]+/g,' ').trim();
// Kararlar: bykt adresi → {t:'merge', d:Dedektif adresi} | {t:'none'} (Dedektif'te yok / eşleşme yanlış)
const choice = new Map();
let tab = 'un';
const HELP = {
  un: 'Bu bykt.org markaları Boykot Dedektifi\'ndeki hiçbir adla otomatik eşleşmedi. Doğru öneriye tıklayın ya da aramadan bulun. Dedektif\'te yoksa <b>"Dedektif\'te yok"</b> deyin — ayrı marka olarak kalır. Karar vermediklerinizi de ayrı marka sayarım.',
  diff: 'Adı yazım ya da parantez farkıyla aynı olduğu için ön seçili eşleşmeler (adları birebir aynı değil). Turuncu uyarılı olanlarda aynı Dedektif markası birden fazla bykt markasına bağlı. Yanlışsa <b>"Yanlış eşleşme"</b> deyin ya da doğru markayı seçin.',
  same: 'Adı birebir aynı olduğu için eşleşenler. Genelde doğrudur; farklı bir şirketse <b>"Yanlış eşleşme"</b> deyin.'
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logo = (u, n, cls='logo') => {
  const ph = cls==='logo' ? 'ph' : 'mini', ch = esc((n||'?').trim()[0] || '?');
  return u ? `<img class="${cls}" src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-ph="${ph}" data-ch="${ch}">` : `<div class="${ph}">${ch}</div>`;
};
document.addEventListener('error', e => {
  const im = e.target;
  if (im.tagName === 'IMG' && im.dataset.ph) im.replaceWith(Object.assign(document.createElement('div'), {className: im.dataset.ph, textContent: im.dataset.ch}));
}, true);
const vcls = s => { const t = norm(s); return /alinabilir|uygun/.test(t) ? 'g' : /insafa|supheli|arastiriliyor/.test(t) ? 'o' : /boykot/.test(t) ? 'r' : ''; };
const vpill = s => s ? `<span class="v ${vcls(s)}">${esc(s)}</span>` : '';

function current(i){
  const c = choice.get(i.k);
  if (c) return c;
  return i.auto ? {t:'merge', d:i.auto, auto:true} : null;
}
function usage(){
  const u = new Map();
  DATA.by.forEach(i => { const c = current(i); if (c && c.t==='merge') u.set(c.d, (u.get(c.d)||0) + 1); });
  return u;
}
function group(i, u){
  if (!i.auto) return 'un';
  const c = current(i);
  if (!i.same || (c && c.t==='merge' && u.get(c.d) > 1) || i.dup) return 'diff';
  return 'same';
}
function render(){
  const u = usage();
  const groups = {un:[], diff:[], same:[]};
  DATA.by.forEach(i => groups[group(i, u)].push(i));
  for (const g in groups){ const el = document.getElementById('n-'+g); el.textContent = groups[g].length; el.parentElement.hidden = !groups[g].length; }
  if (!groups[tab].length){ const first = ['un','diff','same'].find(g => groups[g].length); if (first && first !== tab){ tab = first; return render(); } }
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab===tab));
  document.getElementById('help').innerHTML = HELP[tab];
  const q = norm(document.getElementById('filter').value || '');
  const items = groups[tab].filter(i => { if (!q) return true; const c = current(i); return norm(i.n).includes(q) || (c && c.t==='merge' && norm(BD.get(c.d).n).includes(q)); });
  const limit = q ? 2000 : 200;
  document.getElementById('list').innerHTML = items.slice(0, limit).map(i => rowHTML(i, u)).join('') + (items.length > limit ? `<div class="help">İlk ${limit} gösteriliyor — aramayla daraltın.</div>` : '');
  document.getElementById('count').textContent = `${items.length} marka`;
  summary(groups);
}
function bdCard(b, pressed, k){
  return `<button class="cand" data-k="${esc(k)}" data-d="${esc(b.k)}" aria-pressed="${pressed}">${logo(b.l, b.n, 'mini')}<span><b>${esc(b.n)}</b> ${vpill(b.s)} <small>${esc((b.c||[]).filter(Boolean).join(', '))}</small></span></button>`;
}
function rowHTML(i, u){
  const c = current(i);
  const merged = c && c.t==='merge' ? BD.get(c.d) : null;
  const how = i.how==='eski' ? 'Eski listenizden' : i.how==='ad' ? 'Aynı ad' : 'Benzer yazım';
  const status = !c ? '<span class="pill warn">Karar bekliyor</span>'
    : c.t==='none' ? (i.auto ? '<span class="pill no">Yanlış eşleşme — ayrı tutulacak</span>' : '<span class="pill">Dedektif\'te yok — ayrı marka</span>')
    : `<span class="pill ok">${c.auto ? how : 'Seçildi'}: ${esc(merged.n)}</span>`;
  const dup = merged && u.get(merged.k) > 1
    ? `<span class="pill warn">Bu Dedektif markası ${u.get(merged.k)} bykt markasına bağlı: ${esc(DATA.by.filter(x => { const cc = current(x); return cc && cc.t==='merge' && cc.d===merged.k; }).map(x => x.n).join(', '))}</span>` : '';
  const sug = (i.sug||[]).map(k => BD.get(k)).filter(Boolean).map(b => bdCard(b, !!(merged && merged.k===b.k), i.k)).join('');
  const shown = merged && !(i.sug||[]).includes(merged.k) ? bdCard(merged, true, i.k) : '';
  const action = !(c && c.t==='none')
    ? (i.auto || (c && c.t==='merge') ? `<button class="link bad" data-act="none" data-k="${esc(i.k)}">Yanlış eşleşme</button>` : `<button class="link" data-act="none" data-k="${esc(i.k)}">Dedektif'te yok</button>`)
    : '';
  const undo = choice.has(i.k) ? `<button class="link" data-act="undo" data-k="${esc(i.k)}">Geri al</button>` : '';
  const cls = c && c.t==='none' && i.auto ? 'split' : (choice.has(i.k) ? 'done' : '');
  return `<div class="row ${cls}">
    <div class="brand">${logo(i.l, i.n)}<div style="min-width:0">
      <div class="src">bykt.org</div>
      <div class="name"><a href="${esc(i.k)}" target="_blank" rel="noopener">${esc(i.n)}</a></div>
      <div class="meta">${vpill(i.s)} ${esc(i.c)}</div>
    </div></div>
    <div class="right">
      <div class="src">Boykot Dedektifi'ndeki karşılığı</div>
      <div class="choice">${status} ${action} ${undo}</div>
      ${dup ? `<div class="choice">${dup}</div>` : ''}
      <div class="cands">${shown}${sug}</div>
      ${merged ? `<div class="meta"><a href="${esc(merged.k)}" target="_blank" rel="noopener">Dedektif sayfasını aç</a></div>` : ''}
      <div class="search"><input type="search" placeholder="Dedektif'te ara (ör. Nestle)…" data-search="${esc(i.k)}" autocomplete="off"><div class="results" hidden></div></div>
    </div>
  </div>`;
}
function summary(groups){
  let merge=0, none=0;
  choice.forEach(c => { if (c.t==='merge') merge++; else none++; });
  const pending = groups.un.filter(i => !choice.has(i.k)).length;
  document.getElementById('summary').innerHTML = `Seçimleriniz: <b>${merge}</b> eşleştirme · <b>${none}</b> ayrı · eşleşmeyenlerden <b>${pending}</b> karar bekliyor`;
}
function output(){
  const eslesmeler = [], yok = [], bekleyen = [], degisen = [];
  DATA.by.forEach(i => {
    const c = current(i);
    if (!c) bekleyen.push(i.k);
    else if (c.t==='none') yok.push(i.k);
    else eslesmeler.push({bykt: i.k, dedektif: c.d});
    if (choice.has(i.k)) degisen.push(i.k);
  });
  return JSON.stringify({olusturulma: new Date().toISOString(), eslesmeler, dedektifte_yok: yok, karar_verilmedi: bekleyen, elle_karar_verilen: degisen}, null, 1) + '\n';
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; setTimeout(()=>el.textContent='',3000); }

document.addEventListener('click', e => {
  const tb = e.target.closest('.tabs button');
  if (tb){ tab = tb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const cand = e.target.closest('.cand, .results button');
  if (cand && cand.dataset.k){
    const i = BY.get(cand.dataset.k);
    if (i.auto === cand.dataset.d) choice.delete(i.k); else choice.set(i.k, {t:'merge', d:cand.dataset.d});
    render(); return;
  }
  const act = e.target.closest('[data-act]');
  if (act){
    const k = act.dataset.k;
    if (act.dataset.act==='undo') choice.delete(k); else choice.set(k, {t:'none'});
    render(); return;
  }
  if (!e.target.closest('.search')) document.querySelectorAll('.results').forEach(r => r.hidden = true);
});
document.addEventListener('input', e => {
  if (e.target.id==='filter'){ render(); return; }
  const k = e.target.dataset.search;
  if (k === undefined) return;
  const q = norm(e.target.value);
  const box = e.target.nextElementSibling;
  if (q.length < 2){ box.hidden = true; return; }
  const starts = [], has = [];
  DATA.bd.forEach(b => { const n = norm(b.n); if (n.startsWith(q)) starts.push(b); else if (n.includes(q)) has.push(b); });
  const res = starts.concat(has).slice(0, 30);
  box.innerHTML = res.length ? res.map(b => `<button data-k="${esc(k)}" data-d="${esc(b.k)}">${logo(b.l, b.n, 'mini')}<span><b>${esc(b.n)}</b> ${vpill(b.s)} <small>${esc((b.c||[]).filter(Boolean).join(', '))}</small></span></button>`).join('') : '<div class="sub" style="padding:8px">Bulunamadı</div>';
  box.hidden = false;
});
document.getElementById('download').onclick = () => {
  const blob = new Blob([output()], {type:'application/json'});
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: 'eslesme_kararlari.json'});
  document.body.appendChild(a); a.click(); a.remove();
  toast('İndirildi');
};
document.getElementById('load').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    const manual = new Set(d.elle_karar_verilen || []);
    let n = 0;
    (d.eslesmeler || []).forEach(p => { if (manual.has(p.bykt) && BY.has(p.bykt) && BD.has(p.dedektif)) { choice.set(p.bykt, {t:'merge', d:p.dedektif}); n++; } });
    (d.dedektifte_yok || []).forEach(k => { if (manual.has(k) && BY.has(k)) { choice.set(k, {t:'none'}); n++; } });
    render(); toast(`${n} kararınız yüklendi`);
  } catch { toast('Dosya okunamadı'); }
  e.target.value = '';
};
window.addEventListener('beforeunload', e => { if (choice.size) { e.preventDefault(); e.returnValue = ''; } });
render();
</script>
</body>
</html>
