name: Gece taraması

on:
  schedule:
    - cron: "17 0 * * *"   # her gün 03:17 (Türkiye saati)
  workflow_dispatch:
  push:                    # tarayıcı ya da ayarlar (ör. eşleşme kararları) değişince hemen çalışır
    branches: [main]
    paths: ["scraper/**", "config/**", ".github/workflows/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r scraper/requirements.txt

      - name: Testler (internetsiz, örnek sayfalarla)
        run: python -m unittest discover -s scraper/tests

      - name: Tara ve birleştir
        id: tara
        run: |
          set +e
          python scraper/run.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Özet
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Yayınla
        if: steps.tara.outputs.code == '0'
        run: |
          git config user.name "boycott-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json meta.json logos state
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -q -m "veri: $(python -c 'import json;m=json.load(open("meta.json"));print(m["version"], m["brandCount"], "marka")')"
            git push
          fi

      - name: Bildirim (Issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.tara.outputs.code }}
        run: |
          test -f report.md || echo "Tarama hata verdi; kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > report.md
          gh label create tarama --color d93f0b --description "Gece taraması bildirimi" --force >/dev/null
          NUM=$(gh issue list --label tarama --state open --json number -q '.[0].number')
          PENDING=$(python -c 'import json,os;print(len(json.load(open("state/bekleyen.json"))) if os.path.exists("state/bekleyen.json") else 0)')
          if [ "$CODE" != "0" ] || [ "$PENDING" != "0" ]; then
            if [ -z "$NUM" ]; then
              gh issue create --label tarama --title "Tarama: ilginiz gerekiyor" --body-file report.md
            else
              gh issue edit "$NUM" --body-file report.md
              if [ "$CODE" != "0" ]; then
                gh issue comment "$NUM" --body "⚠️ Bu geceki tarama yayınlanmadı. Ayrıntılar yukarıda."
              fi
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Tarama sorunsuz; onay bekleyen eşleşme kalmadı."
          fi
