name: Gece güncellemesi

# Her gece yalnızca boykot durumları güncellenir (scraper/gece.py).
# Pazartesi geceleri ayrıca yeni markalar eklenir; emin olunamayanlar sorular/ klasöründe size sorulur.
# Kararlarınızı sorular/eslesme_kararlari.json olarak yüklediğinizde de otomatik çalışır.
on:
  schedule:
    - cron: "17 0 * * *"     # her gün 03:17 (Türkiye saati)
  push:
    branches: [main]
    paths: ["sorular/eslesme_kararlari.json"]
  workflow_dispatch:
    inputs:
      haftalik:
        description: "Yeni markaları da ekle (haftalık eşleştirme)"
        type: boolean
        default: false
      zorla:
        description: "Durum değişikliği sınırını yok say (değişiklikleri kontrol ettiyseniz)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r scraper/requirements.txt

      - name: Testler (internetsiz)
        run: python -m unittest discover -s scraper/tests

      - name: Güncelle
        id: run
        env:
          HAFTALIK: ${{ inputs.haftalik }}
          ZORLA: ${{ inputs.zorla }}
        run: |
          set +e
          ARGS=""
          if [ "$(TZ=Europe/Istanbul date +%u)" = "1" ] || [ "$HAFTALIK" = "true" ]; then ARGS="$ARGS --haftalik"; fi
          if [ "$ZORLA" = "true" ]; then ARGS="$ARGS --zorla"; fi
          python scraper/gece.py $ARGS
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Özet
        if: always()
        run: test -f report.md && cat report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Yayınla
        if: steps.run.outputs.code == '0'
        run: |
          git config user.name "boycott-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A catalog.json meta.json logos state kaynak config sorular
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -q -m "veri: $(python -c 'import json;m=json.load(open("meta.json"));print(m["version"], m["brandCount"], "marka")')"
            # GitHub zaman zaman gönderimi geçici bir hatayla reddediyor ("fatal error in commit_refs_rules"): birkaç kez dene
            for i in 1 2 3 4 5; do
              if git pull --rebase -q && git push; then exit 0; fi
              echo "Gönderim denemesi $i başarısız; bekleniyor…"; sleep $((i * 30))
            done
            exit 1
          fi

      - name: Bildirim (Issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.run.outputs.code }}
        run: |
          test -f report.md || echo "Güncelleme hata verdi; kayıt: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > report.md
          gh label create tarama --color d93f0b --description "Gece güncellemesi bildirimi" --force >/dev/null
          NUM=$(gh issue list --label tarama --state open --json number -q '.[0].number')
          if [ "$CODE" != "0" ] || [ -f sorular/eslestirme_sorular.html ]; then
            if [ -z "$NUM" ]; then
              gh issue create --label tarama --title "Veri güncellemesi: ilginiz gerekiyor" --body-file report.md
            else
              gh issue edit "$NUM" --body-file report.md
              [ "$CODE" != "0" ] && gh issue comment "$NUM" --body "⚠️ Bu geceki güncelleme yayınlanmadı. Ayrıntılar yukarıda." || true
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Güncelleme sorunsuz; bekleyen soru kalmadı."
          fi
